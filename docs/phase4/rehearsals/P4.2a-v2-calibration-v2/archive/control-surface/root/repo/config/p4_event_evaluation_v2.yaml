formal_development_rounds:
  maximum_rounds: 6
  each_round_uses_one_byte_frozen_prompt: true
  models_always_measured:
    - qwen3.7-flash
    - qwen3.6-plus
  fixed_model_call_order:
    - qwen3.7-flash
    - qwen3.6-plus
  automatic_retries: 0
  failed_candidate_retries: 0
  expected_predictions_per_model: 45
  technical_failure_policy: model_result_gate_fails_without_denominator_exclusion_or_replacement
  terminal_result_policy: append_once_even_when_failed
  candidate_contract_pair_invariant:
    allowed_differences: [model]
    prompt_bytes_identical: true
    endpoint_identical: true
    result_schema_identical: true
    taxonomy_identical: true
    llm_parameters_identical: true
    evidence_validation_identical: true
  selection_rule: flash_if_both_gates_else_plus_if_both_gates_else_none
  stop_rule: stop_after_first_recorded_round_with_a_selected_model_or_after_round_6

metrics:
  materiality_positive_definition: gold_or_prediction_materiality_gte_2
  symbol_gate_scope_resolution:
    threshold_and_formula_changed: false
    prior_scope: all100_mixed_dev_and_heldout_reference
    v2_scope: heldout60_human_adjudicated_only
    all105_pooling_forbidden: true
    rationale: development45_is_a_prompt_tuning_frame_and_may_not_be_pooled_into_a_final_gate
  materiality_precision:
    formula: tp / (tp + fp)
    metric_partition:
      development: candidate_round_predicted_positive
      heldout: selected_model_predicted_positive_stratum
    sampling_frame:
      development: development_frame_v2_baseline_stratified_30_positive_15_negative
      heldout: heldout_frame_v2_selected_model_stratified_40_positive_20_negative
    sampling_strata:
      development: [baseline_predicted_positive, baseline_predicted_negative]
      heldout: [selected_model_predicted_positive, selected_model_predicted_negative]
    denominator:
      development: candidate_round_predicted_positive_count
      heldout: 40
    estimator:
      development: unweighted_quota_frame_gate
      heldout: simple_random_sample_within_selected_model_positive_stratum
    population_estimate:
      development: false
      heldout: true
    minimum: 0.80
    zero_denominator_policy: fail
    gate: true
    gate_or_diagnostic:
      development: development_gate
      heldout: final_one_shot_gate
  materiality_false_omission_rate:
    formula: fn / (fn + tn)
    metric_partition:
      development: candidate_round_predicted_negative
      heldout: selected_model_predicted_negative_stratum
    sampling_frame:
      development: development_frame_v2_baseline_stratified_30_positive_15_negative
      heldout: heldout_frame_v2_selected_model_stratified_40_positive_20_negative
    sampling_strata:
      development: [baseline_predicted_positive, baseline_predicted_negative]
      heldout: [selected_model_predicted_positive, selected_model_predicted_negative]
    denominator:
      development: candidate_round_predicted_negative_count
      heldout: 20
    estimator:
      development: unweighted_quota_frame_gate
      heldout: simple_random_sample_within_selected_model_negative_stratum
    population_estimate:
      development: false
      heldout: true
    maximum: 0.20
    zero_denominator_policy: fail
    gate: true
    gate_or_diagnostic:
      development: development_gate
      heldout: final_one_shot_gate
  materiality_recall:
    formula: not_estimable
    metric_partition:
      legacy: baseline_predicted_positive_only_structurally_all_predicted_positive
      development: omitted_in_favor_of_false_omission_rate
      heldout: omitted_in_favor_of_false_omission_rate
    sampling_frame:
      legacy: legacy_predicted_positive_only_frame
      development: development_frame_v2_baseline_stratified_30_positive_15_negative
      heldout: heldout_frame_v2_selected_model_stratified_40_positive_20_negative
    sampling_strata:
      legacy: [baseline_predicted_positive]
      development: [baseline_predicted_positive, baseline_predicted_negative]
      heldout: [selected_model_predicted_positive, selected_model_predicted_negative]
    denominator:
      legacy: structurally_uninformative
      development: not_estimated
      heldout: not_estimated
    reporting_status: omitted_as_not_estimable_under_the_preregistered_f4_policy
    value: null
    replacement_metric: materiality_false_omission_rate
    gate: false
    gate_or_diagnostic: omitted_not_estimable
    v2_report_policy: omit_or_emit_null_not_estimable_never_emit_naive_numeric_recall
  symbol_exact_set_accuracy:
    formula: exact_symbol_set_matches / comparable_predictions
    metric_partition: all_successful_candidate_predictions
    sampling_frame:
      development: development_frame_v2_baseline_stratified_30_positive_15_negative
      heldout: heldout_frame_v2_selected_model_stratified_40_positive_20_negative
    sampling_strata:
      development: [baseline_predicted_positive, baseline_predicted_negative]
      heldout: [selected_model_predicted_positive, selected_model_predicted_negative]
    denominator:
      development: 45_if_technical_completion_passes
      heldout: 60_if_technical_completion_passes
    minimum: 0.95
    population_estimate: false
    development_stage: diagnostic_not_part_of_the_two_materiality_development_gates
    heldout_stage: unchanged_phase_gate
    zero_denominator_policy: fail
    gate_or_diagnostic: development_diagnostic_and_heldout_gate
  symbol_bearing_exact_set_accuracy:
    formula: exact_symbol_set_matches_on_gold_or_prediction_symbol_bearing_items / symbol_bearing_items
    metric_partition: gold_or_prediction_symbol_bearing_items
    sampling_frame:
      development: development_frame_v2_baseline_stratified_30_positive_15_negative
      heldout: heldout_frame_v2_selected_model_stratified_40_positive_20_negative
    sampling_strata:
      development: [baseline_predicted_positive, baseline_predicted_negative]
      heldout: [selected_model_predicted_positive, selected_model_predicted_negative]
    denominator:
      development: gold_or_prediction_symbol_bearing_item_count_in_dev45
      heldout: gold_or_prediction_symbol_bearing_item_count_in_heldout60
    minimum: 0.95
    population_estimate: false
    development_stage: diagnostic_not_part_of_the_two_materiality_development_gates
    heldout_stage: unchanged_phase_gate
    zero_denominator_policy: fail
    gate_or_diagnostic: development_diagnostic_and_heldout_gate
  source_pool_weighted_diagnostics:
    gate: false
    purpose: expose_the_effect_of_unequal_baseline_stratum_sampling_rates
    estimator: inverse_probability_weighted_by_baseline_sampling_stratum
    metric_partition: candidate_round_predicted_output_partition
    sampling_frame: development_source_candidate_pool_after_retirement
    sampling_strata: [baseline_predicted_positive, baseline_predicted_negative]
    denominator: inverse_probability_weighted_partition_total
    gate_or_diagnostic: diagnostic
    baseline_positive_item_weight: 28.466666666666665
    baseline_negative_item_weight: 139.8
    formula:
      materiality_precision: weighted_tp / (weighted_tp + weighted_fp)
      materiality_false_omission_rate: weighted_fn / (weighted_fn + weighted_tn)
    note: The fixed 0.80 and 0.20 development gates apply only to the unweighted quota frame; weighted source-pool figures are diagnostics and may not override a gate.
  disclosure_required_for_every_metric:
    - metric_partition
    - sampling_frame
    - sampling_strata
    - denominator
    - formula
    - gate_or_diagnostic

