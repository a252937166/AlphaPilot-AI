services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alphapilot
      POSTGRES_USER: alphapilot
      POSTGRES_PASSWORD: alphapilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphapilot -d alphapilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - .env
    environment:
      ALPHAPILOT_DATABASE_URL: postgresql+psycopg://alphapilot:alphapilot@postgres:5432/alphapilot
      ALPHAPILOT_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
