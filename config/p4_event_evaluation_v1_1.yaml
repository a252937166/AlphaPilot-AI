splits:
  dev_60:
    sample_tag: dev60
    role: prompt_development
    count: 60
    source_artifact: dev_60_frozen_jsonl
    owner_completed_annotation_artifact: dev_60_owner_annotations_jsonl
    prompt_iteration_allowed: true
    heldout_data_access_allowed: false
    materiality_metrics_gate: false
  heldout_40:
    sample_tag: heldout40
    role: heldout_test
    count: 40
    prompt_iteration_allowed: false
    owner_blind_sample_artifact: heldout_40_blind_sample_jsonl
    owner_completed_annotation_artifact: heldout_40_owner_annotations_jsonl
    selection_must_not_create:
      - heldout_40_owner_annotations_jsonl
      - combined_100_annotations_jsonl
      - owner_completion_manifest_json
    candidate_batch:
      date_field: available_time
      timezone: Asia/Shanghai
      window_start_inclusive: "2026-08-04T00:00:00+08:00"
      window_end_exclusive: "2026-08-06T00:00:00+08:00"
      selection_ready_after: "2026-08-06T00:10:00+08:00"
      trading_dates: ["2026-08-04", "2026-08-05"]
      min_news_item_id_exclusive: 423
      sources: [cninfo, akshare_ths, sina_company_news]
      prediction_scope: all_eligible_batch_rows
    prediction_inputs:
      artifact: heldout_candidate_inputs_jsonl
      create_once_before_prediction: true
      cninfo_announcement_body_required: true
      second_body_fetch_for_owner_delivery_forbidden: true
      required_record_fields:
        - news_item_id
        - source
        - url
        - title
        - ingested_symbol
        - published_at
        - available_time
        - original_text
        - body_state
        - text_sha256
        - input_sha256
        - body_evidence
      prediction_annotation_join_keys: [news_item_id, input_sha256, text_sha256]
    eligible_pool:
      prediction_status: ok
      materiality_minimum: 2
      positive_rate_denominator: successful_predictions
      failed_predictions_are_ineligible_and_reported: true
    sampling:
      algorithm: sha256_rank_without_replacement_v1
      deterministic_seed: alphapilot-p4.2a-heldout40-v1.1-20260803
      rank_input_format: "utf8(seed) || 0x00 || ascii(news_item_id) || 0x00 || ascii(input_sha256)"
      digest: sha256
      order: digest_ascending_then_news_item_id_ascending
      without_replacement: true
      selected_count: 40
      insufficient_pool_policy: fail_without_substitution

prediction_contract_freeze:
  development_source: dev60_only
  versioned_contract_required_after_prompt_change: true
  receipt_artifact: prediction_contract_freeze_receipt_json
  receipt_created_before_heldout_candidate_prediction: true
  receipt_created_after_dev_final_predictions: true
  receipt_create_only: true
  required_receipt_fields:
    - design_schema_version
    - design_sha256
    - frozen_at_utc
    - contract_path
    - contract_sha256
    - contract_schema_version
    - model
    - prompt_path
    - prompt_sha256
    - result_schema_path
    - result_schema_sha256
    - taxonomy_version
    - dev_final_predictions_path
    - dev_final_predictions_sha256
    - dev_final_predictions_manifest_path
    - dev_final_predictions_manifest_sha256
    - dev_final_predictions_row_count
    - dev_final_predictions_success_count
    - dev_final_predictions_failure_count
    - dev_final_predictions_identity_sha256
    - dev_final_predictions_contract_sha256
  required_model: qwen3.6-flash
  required_result_schema_sha256: 0ac68654ce23ecd4e537d849d695e092c76dcb9de0fb03793e65ae62b181947f
  required_taxonomy_version: p4-news-event-taxonomy-v1
  bytes_reverified_before_each_heldout_use: true
  prompt_change_after_receipt_forbidden: true
  dev_final_predictions:
    predictions_artifact: dev_final_predictions_jsonl
    manifest_artifact: dev_final_predictions_manifest_json
    row_count: 60
    required_identity_match_artifact: dev_60_frozen_jsonl
    ordered_by: news_item_id_ascending
    ordered_identity_fields: [news_item_id, input_sha256, text_sha256]
    ordered_identity_digest_format: "ascii(news_item_id) || 0x00 || lowercase_ascii(input_sha256) || 0x00 || lowercase_ascii(text_sha256) || 0x0A"
    ordered_identity_digest: sha256
    unique_news_item_ids_required: true
    success_plus_failure_must_equal_row_count: true
    contract_sha256_must_equal_receipt_contract_sha256: true
    manifest_required_fields:
      - design_sha256
      - contract_sha256
      - predictions_path
      - predictions_sha256
      - row_count
      - success_count
      - failure_count
      - ordered_identity_sha256
      - completed_at_utc
  heldout_inference_requires_valid_receipt: true

one_shot:
  inference:
    state_artifact: heldout_inference_state_jsonl
    format: append_only_jsonl
    started_event: inference_started
    terminal_events: [inference_completed, inference_failed]
    started_fsynced_before_first_model_call: true
    maximum_started_events: 1
    existing_started_event_blocks_rerun: true
    required_preconditions:
      - valid_prediction_contract_freeze_receipt
      - dev_final_predictions_bytes_and_manifest_verified
      - dev_final_predictions_contract_matches_active_contract
  evaluation:
    state_artifact: heldout_evaluation_state_jsonl
    format: append_only_jsonl
    started_event: evaluation_started
    terminal_events: [evaluation_completed, evaluation_failed]
    started_fsynced_before_first_score_read: true
    maximum_started_events: 1
    existing_started_event_blocks_reevaluation: true
    required_preconditions:
      - valid_owner_completion_manifest
      - owner_completion_artifact_bytes_and_counts_verified
      - combined_annotations_sha256_and_identity_match_manifest
  invalidation_policy: register_new_heldout_sample_and_design_version

owner_delivery:
  predictions_visible: false
  selection_basis_visible: false
  forbidden_fields:
    - prediction
    - model_prediction
    - model_output
    - predicted_materiality
    - selection_basis
    - selection_reason
    - selection_rank
    - selection_score
    - eligible_pool
    - eligible_pool_size
    - candidate_pool_membership
    - prediction_artifact
  forbidden_field_policy: fail_closed
  required_owner_fields:
    - news_item_id
    - source
    - url
    - title
    - ingested_symbol
    - published_at
    - available_time
    - original_text
    - input_sha256
    - text_sha256
    - annotation_status
    - gold

owner_annotation_completion:
  schema_version: p4.2a-owner-completion-v1.1
  manifest_artifact: owner_completion_manifest_json
  manifest_create_only: true
  dev:
    blind_source_artifact: dev_60_frozen_jsonl
    completed_annotation_artifact: dev_60_owner_annotations_jsonl
    required_row_count: 60
    required_completed_count: 60
  heldout:
    blind_source_artifact: heldout_40_blind_sample_jsonl
    selection_manifest_artifact: heldout_selection_manifest_json
    completed_annotation_artifact: heldout_40_owner_annotations_jsonl
    required_row_count: 40
    required_completed_count: 40
  combined:
    artifact: combined_100_annotations_jsonl
    required_row_count: 100
    create_only_after_preconditions: true
    order: dev_then_heldout
    renumbering_rule: dev_preserve_1_60_then_heldout_add_60_to_61_100
    ordered_identity_fields: [sample_index, news_item_id, input_sha256, text_sha256]
    ordered_identity_digest_format: "ascii(sample_index) || 0x00 || ascii(news_item_id) || 0x00 || lowercase_ascii(input_sha256) || 0x00 || lowercase_ascii(text_sha256) || 0x0A"
    ordered_identity_digest: sha256
  preconditions_before_combined_create:
    - dev_owner_annotations_all_completed
    - heldout_owner_annotations_all_completed
    - dev_identity_and_hash_match_blind_source
    - heldout_identity_and_hash_match_blind_source
    - owner_outputs_pass_forbidden_field_blindness_check
    - combined_target_and_completion_manifest_absent
  required_manifest_fields:
    - schema_version
    - design_sha256
    - annotation_contract_sha256
    - dev_blind_sample_path
    - dev_blind_sample_sha256
    - dev_owner_annotations_path
    - dev_owner_annotations_sha256
    - dev_owner_annotations_row_count
    - dev_completed_count
    - heldout_blind_sample_path
    - heldout_blind_sample_sha256
    - heldout_selection_manifest_path
    - heldout_selection_manifest_sha256
    - heldout_owner_annotations_path
    - heldout_owner_annotations_sha256
    - heldout_owner_annotations_row_count
    - heldout_completed_count
    - combined_annotations_path
    - combined_annotations_sha256
    - combined_annotations_row_count
    - combined_ordered_identity_sha256
    - combined_renumbering_rule
    - identity_validation_passed
    - blindness_validation_passed
    - completed_at_utc

evaluation:
  sample_count: 100
  split_counts: {dev60: 60, heldout40: 40}
  prompt_iteration_scope: dev60_only
  heldout_test_runs_maximum: 1
  materiality_positive_definition: materiality_gte_2
  materiality_precision_formula: tp_divided_by_tp_plus_fp
  materiality_zero_predicted_positive_policy: fail
  materiality_precision_gate_scope: heldout40
  materiality_precision_minimum: 0.80
  symbol_mapping_formula: exact_set_match_accuracy
  symbol_mapping_gate_scope: all100
  symbol_mapping_accuracy_minimum: 0.95
  symbol_bearing_exact_set_accuracy_minimum: 0.95
  report_split_metrics: [dev60, heldout40, all100]
  report_null_gold_false_positive_rate: true
  event_type_exact_match_is_diagnostic: true
  direction_exact_match_is_diagnostic: true
  threshold_changes_forbidden: true
  failed_rounds_append_only: true
  heldout_rerun_forbidden: true
  frozen_diagnostics:
    offline_trial_predictions_artifact: offline_trial_predictions_jsonl
    offline_trial_report_artifact: offline_trial_report_json
    offline_trial_gold_intersection_failure_ids: [190]
    offline_trial_failure_counts_for_recall_not_precision: true
    active_prediction_failures_reported_separately: true
  required_report_fields:
